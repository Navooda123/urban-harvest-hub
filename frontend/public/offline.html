<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Harvest Hub — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(76, 175, 80, 0.1);
      border: 2px solid rgba(76, 175, 80, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(76,175,80,0); }
    }
    .icon {
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 0.5rem;
    }
    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(76, 175, 80, 0.08);
      border: 1px solid rgba(76, 175, 80, 0.2);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      margin: 1.5rem 0;
      font-size: 0.8rem;
      color: #86efac;
      font-weight: 500;
    }
    button {
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    button:hover { opacity: 0.9; transform: scale(1.02); }
    button:active { transform: scale(0.98); }
    .status {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <span class="icon">🌿</span>
    </div>
    <h1>You're Offline</h1>
    <p>Urban Harvest Hub can't connect to the internet right now. Pages you've visited before are still available.</p>
    <div class="tip">
      📶 &nbsp; Dynamic actions like bookings require an active connection.
    </div>
    <button onclick="window.location.reload()">
      Try Again
    </button>
    <p class="status" id="status">Checking for connection…</p>
  </div>
  <script>
    // Auto-refresh when connection restores
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = '✅ Connection restored! Redirecting…';
      setTimeout(() => window.location.href = '/', 800);
    });
    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = '❌ Still offline.';
    });
    // Check immediately
    if (navigator.onLine) {
      document.getElementById('status').textContent = '✅ Connection detected. Click Try Again.';
    } else {
      document.getElementById('status').textContent = '❌ No internet connection detected.';
    }
  </script>
</body>
</html>
