<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="11.52" fill="url(#bg)"/>
  <!-- Leaf / sprout icon centered -->
  <g transform="translate(32, 33.28)">
    <!-- Stem -->
    <line x1="0" y1="16" x2="0" y2="-3.2"
      stroke="url(#leaf)" stroke-width="2.88" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M0,-2.56 C-17.92,-16 -20.48,-3.2 0,5.12"
      fill="url(#leaf)" opacity="0.92"/>
    <!-- Right leaf -->
    <path d="M0,-2.56 C17.92,-16 20.48,-3.2 0,5.12"
      fill="white" opacity="0.85"/>
  </g>
</svg>